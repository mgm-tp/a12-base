# Run `gradle versionCatalogUpdate --interactive` to update this file
[versions]
groovy-yaml = "5.0.3"
jackson = "2.22.1"
commons-lang3 = "3.20.0"
commons-io = "2.21.0"
testng = "7.11.0"
jsonassert = "1.5.3"
equalsverifier = "4.3"
spotbugs-plugin = "6.4.8"
cyclonedx-plugin = "3.1.0"
spotless-plugin = "8.1.0"
build-utilities = "0.7.0"
integration = "0.1.10"
version-catalog-update = "1.1.0"

[libraries]
groovy-yaml = { module = "org.apache.groovy:groovy-yaml", version.ref = "groovy-yaml" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
commons-io = { module = "org.apache.commons:commons-io", version.ref = "commons-io" }
testng = { module = "org.testng:testng", version.ref = "testng" }
jsonassert = { module = "org.skyscreamer:jsonassert", version.ref = "jsonassert" }
equalsverifier = { module = "nl.jqno.equalsverifier:equalsverifier", version.ref = "equalsverifier" }
build-utilities = { module = "com.mgmtp.a12.devtools.plugins:build-utilities", version.ref = "build-utilities" }

[plugins]
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-plugin" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless-plugin" }
integration = { id = "com.mgmtp.a12.devtools.plugins.integration", version.ref = "integration" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "version-catalog-update" }
