packages:
  - codemod
  - documentation
  - model-api-ts
  - model-migration-api-ts

catalogs:
  # all a12 dependencies should be listed here (regardless of how many workspaces use them)
  # this is done to have a single 'entry point' for upgrading a12
  a12:
    '@com.mgmtp.a12.devtools/build-tools': ^1.1.0
    '@com.mgmtp.a12.devtools/codemod': ^2.1.0
    '@com.mgmtp.a12.devtools/docu': ^0.1.0
    '@com.mgmtp.a12.devtools/eslint-config': ^3.1.0
    '@com.mgmtp.a12.devtools/prettier-config': ^1.1.0
    '@com.mgmtp.a12.devtools/tsconfig': ^1.1.0
    '@com.mgmtp.a12.utils/utils-localization': ^7.2.0

  default:
    '@types/mocha': ^10.0.10
    '@types/node': ^26.1.1
    c8: ^12.0.0
    eslint: ^9.39.5
    eslint-plugin-mocha: ^11.3.0
    eslint-plugin-notice: ^1.0.0
    eslint-plugin-workspaces: ^0.12.1
    mocha: ^11.7.5
    prettier: ^3.9.5
    rimraf: ^6.1.2
    source-map-support: ^0.5.21
    typedoc: ^0.28.15
    typedoc-plugin-missing-exports: ^4.1.2
    typescript: ^5.9.3
    ts-morph: ^27.0.2

# cleanup unused catalog entries during install
cleanupUnusedCatalogs: true

# no cycles between workspace dependencies
disallowWorkspaceCycles: true

# enforce version constraints from package.json
engineStrict: true

# when using "--filter", check that the filter applies to some package
failIfNoMatch: true

# do not check git status when publishing
gitChecks: false

allowBuilds:
  esbuild: false

# CI sets this to warn by default
loglevel: info

# prevent pnpm >10 from self-upgrading,
# since it doesn't use the global node_modules as target
pmOnFail: ignore

# enforce new packages to be at least 1 week old, except our own
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@com.mgmtp.a12.*/*'
  # security patch deliberately pinned ahead of the age gate
  # (GHSA-rgw5-rvv9-x895). Can be dropped once the patched
  # versions age out on 2026-08-06.
  - brace-expansion

# allow conflicting peer dependencies for A12 packages
peerDependencyRules:
  allowAny:
    - "@com.mgmtp.a12.*/*"

# ensure latest deps are installed when updating for audit
resolutionMode: highest

strictPeerDependencies: true

# (for now), only trusted authors can change the lockfile
trustLockfile: true

# do not install packages where trust level decreased
trustPolicy: no-downgrade

# 90d - only police recent publishes; older provenance gaps predate npm attestations
trustPolicyIgnoreAfter: 129600

# before "pnpm run" calls, checks if node_modules are up-to-date
# (e.g. after rebasing / checking out a branch and forgetting "pnpm install")
verifyDepsBeforeRun: warn
