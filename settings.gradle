enableFeaturePreview 'STABLE_CONFIGURATION_CACHE'

rootProject.name = 'base'

dependencyResolutionManagement {
    versionCatalogs {
        if (file('gradle/a12-internal.versions.toml').exists()) {
            create('a12Internal') {
                from(files('gradle/a12-internal.versions.toml'))
            }
        }
    }
}

include(
    ':base-bom',
    ':model-api',
    ':model-api-ts',
    ':model-marshalling',
    ':model-utils',
    ':model-consistency',
    ':fs-model-repository',
    ':documentation',
    ':codemod'
)

if (file('security').exists()) {
    include('security')
}
