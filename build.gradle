buildscript {
    dependencies {
        classpath libs.build.utilities
    }
}

plugins {
    alias(libs.plugins.spotbugs) apply false
    alias(libs.plugins.spotless) apply false
    alias(libs.plugins.cyclonedx) apply false
    alias(libs.plugins.version.catalog.update)
    alias(libs.plugins.integration)
}

import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.mgmtp.a12.devtools.gradle.plugins.buildutils.Helper
import com.mgmtp.a12.devtools.gradle.plugins.buildutils.tasks.LeadingBuildTask
import com.mgmtp.a12.devtools.gradle.plugins.buildutils.tasks.PackageJsonModifierTask
import groovy.json.JsonSlurper
import groovy.yaml.YamlSlurper
import nl.littlerobots.vcu.plugin.resolver.VersionSelectors
import org.cyclonedx.model.ExternalReference

import java.nio.file.Files
import java.nio.file.Path
import java.nio.file.Paths

/** Define a proper version in build */
String globalVersion = Helper.getVersion(
    providers,
    layout.projectDirectory.file('package.json'),
    project.findProperty('version') as String,
    project.findProperty('use') as String
)

String pnpmVersion = getPnpmVersion()

String getPnpmVersion() {
    return (new JsonSlurper().parse(file("package.json"))["packageManager"] as String).split("\\+")[0]
}

allprojects {
    apply plugin: 'base'

    version = globalVersion
    group = 'com.mgmtp.a12.base'

    tasks.register('deploy') {}
}

if (file('publish/build.gradle').exists()) {
    apply from: 'publish/build.gradle'
}

final def jacksonBom = libs.jackson.bom

subprojects {
    // Shared configuration for Java library modules
    if (
        !project.name.endsWith('-ts')
            && project.name != 'documentation'
            && project.name != 'security'
            && project.name != 'codemod'
    ) {
        apply plugin: 'maven-publish'
        apply plugin: 'org.cyclonedx.bom'

        // base-bom is a java-platform project, so it must not use the java plugin
        if (project.name != 'base-bom') {
            apply plugin: 'java-library'
            apply plugin: 'com.github.spotbugs'
            apply plugin: 'com.diffplug.spotless'

            java {
                toolchain {
                    languageVersion = JavaLanguageVersion.of(25)
                }
                withSourcesJar()
            }

            dependencies {
                api platform(jacksonBom)
            }

            tasks.withType(JavaCompile).configureEach {
                options.release.set(21)
                options.encoding = 'UTF-8'
                options.deprecation = true
                options.compilerArgs << '-Werror'
                options.compilerArgs << '-Xlint:deprecation'
            }

            tasks.withType(Jar).configureEach {
                into('META-INF') {
                    from(rootProject.file('LICENSE'))
                    from(rootProject.file('NOTICE'))
                    from(rootProject.file('THIRD_PARTY_NOTICES'))
                    from(rootProject.file('licenses')) {
                        into('licenses')
                    }
                    from(tasks.named('cyclonedxDirectBom').get().jsonOutput) {
                        rename { 'cyclonedx.json' }
                    }
                }
            }

            // TestNG configuration
            tasks.named('test') {
                useTestNG()
                testLogging {
                    events = ['passed', 'skipped', 'failed']
                    exceptionFormat = 'full'
                }
            }

            // SpotBugs configuration
            spotbugs {
                effort = Effort.valueOf('MAX')
                reportLevel = Confidence.valueOf('HIGH')
                ignoreFailures = false
            }

            spotbugsMain {
                reports {
                    xml.required = true
                    html.required = false
                }
            }

            // Spotless configuration for license headers
            spotless {
                java {
                    licenseHeaderFile rootProject.file('license_header.txt')
                    target 'src/**/*.java'
                }
                format('properties') {
                    licenseHeaderFile(rootProject.file('license_header.txt'), '(^[a-zA-Z])')

                    // transform C-style header in `*.properties` to `#`-comments
                    replaceRegex('Convert C-style block start to properties comment', '(?m)^\\s*/\\*', '##')
                    replaceRegex('Remove C-style block end in properties files', '(?m)^\\s*\\Q*/\\E\\s*$', '##')
                    replaceRegex('Convert C-style block asterisk lines to properties comment', '(?m)^\\s*\\* ?', '# ')

                    target('src/**/*.properties')
                }
            }

            // Maven publishing configuration
            publishing {
                publications {
                    maven(MavenPublication) {
                        from components.java
                    }
                }
            }
        }

        tasks.named('cyclonedxDirectBom') {
            jsonOutput.set(project.layout.buildDirectory.file('cyclonedx.json'))
            xmlOutput.unsetConvention()

            includeBuildSystem = false
            includeConfigs = ['runtimeClasspath']

            externalReferences = [
                new ExternalReference(type: ExternalReference.Type.VCS, url: "https://git.geta12.com")
            ]
        }

        tasks.named('assemble') {
            dependsOn tasks.named('cyclonedxDirectBom')
        }

        // Apply common artifacts and POM configuration to all publications
        afterEvaluate {
            publishing {
                publications.all { publication ->
                    // Add CycloneDX SBOM as artifact
                    artifact(tasks.named('cyclonedxDirectBom').get().jsonOutput) {
                        classifier = 'cyclonedx'
                        extension = 'json'
                    }

                    // Add LICENSE file as artifact
                    artifact(rootProject.file('LICENSE')) {
                        classifier = 'license'
                        extension = 'txt'
                    }

                    // Add NOTICE file as artifact
                    artifact(rootProject.file('NOTICE')) {
                        classifier = 'notice'
                        extension = 'txt'
                    }

                    pom {
                        licenses {
                            license {
                                name = 'EUPL-1.2 OR LicenseRef-Commercial'
                                comments = 'See LICENSE artifact published alongside this module'
                            }
                        }

                        organization {
                            name = 'mgm technology partners GmbH'
                            url = 'https://www.mgm-tp.com'
                        }

                        inceptionYear = '2012'

                        description = project.description

                        properties = [
                            'project.build.sourceEncoding'    : 'UTF-8',
                            'project.reporting.outputEncoding': 'UTF-8'
                        ]
                    }
                }
            }
        }

        tasks.named('deploy') {
            dependsOn tasks.named('publish')
        }
    }
}

project(':documentation') {
    apply plugin: 'com.diffplug.spotless'

    spotless {
        format('asciidoc') {
            target '**/*.adoc'
            // node_modules holds third-party .adoc files that must not get our license header
            targetExclude '**/node_modules/**'
            licenseHeaderFile(rootProject.file('license_header.txt'), '^[=\\[]')
            // transform C-style header to asciidoc block comments
            replaceRegex 'Convert C-style block start to asciidoc block comment start', '^/\\*', '////'
            replaceRegex 'Convert C-style block end to asciidoc block comment end', '^ \\*/', '////\n'
            replaceRegex 'Remove asterisk prefixes', '^ \\* ?', ''
        }
    }
}

tasks.register('configurePnpm', LeadingBuildTask) {
    final Path installDir = Path.of("${rootDir}/.npm")

    doLast {
        if (System.getenv('CI')) {
            println "Installing $pnpmVersion"

            Files.createDirectories(installDir)

            execCommandLine 'npm', 'install', '-g', '--prefix', installDir.toString(), pnpmVersion
        } else {
            final def os = System.getProperty('os.name').toLowerCase()
            final def pnpmCommand = os.contains('win') ? 'where pnpm' : 'which pnpm'
            final def result = pnpmCommand.execute().text.trim()

            if (result) {
                println "pnpm is available at: $result"
            } else {
                throw new GradleException("pnpm is not installed on your system. Please install with 'npm install -g $pnpmVersion'")
            }
        }
    }
}

tasks.register('pnpmInstall', LeadingBuildTask) {
    dependsOn tasks.named('configurePnpm')
    mustRunAfter tasks.named('setVersion')
    doLast { execCommandLine 'pnpm', 'install' }
}

tasks.register('verify', LeadingBuildTask) {
    dependsOn tasks.named('pnpmInstall')
    doLast { execCommandLine 'node', '--run', 'verify' }
}

tasks.register('nodeClean', LeadingBuildTask) {
    doLast { execCommandLine 'node', '--run', 'clean' }
}

tasks.register('nodeBuild', LeadingBuildTask) {
    dependsOn tasks.named('verify')
    doLast { execCommandLine 'node', '--run', 'build' }
}

tasks.register('nodeTest', LeadingBuildTask) {
    mustRunAfter tasks.named('nodeBuild')
    doLast { execCommandLine 'node', '--run', 'test' }
}

tasks.named('clean') {
    dependsOn tasks.named('nodeClean')
}

tasks.named('assemble') {
    dependsOn tasks.named('nodeBuild')
}

tasks.named('check') {
    dependsOn tasks.named('nodeTest')
}

// review builds resolve to the plain -SNAPSHOT version, so stamping would rewrite all
// workspace package.json files to what they already contain
final boolean stampVersion = project.hasProperty('use')

tasks.register('setVersion', PackageJsonModifierTask) {
    onlyIf { stampVersion }
    packageDirs = new YamlSlurper().parse(file('./pnpm-workspace.yaml')).packages
        .collect({ file(it) }) + file('.')
    change = Helper.createSetVersion(version)
}

versionCatalogUpdate {
    sortByKey = false
    versionSelector {
        VersionSelectors.PREFER_STABLE.select(it) && !it.candidate.version.contains('SNAPSHOT')
    }
}
