plugins {
    id 'java-platform'
}

description = 'Project files for the A12 Base Module'

javaPlatform {
    allowDependencies()
}

dependencies {
    // Shared Jackson libraries (BOM import)
    api platform(libs.jackson.bom)

    constraints {
        // Shared commons libraries
        api libs.commons.lang3
        api libs.commons.io

        // A12 dependencies
        api project(':model-api')
        api project(':model-consistency')
        api project(':model-marshalling')
        api project(':model-migration-api')
        api project(':fs-model-repository')
        api project(':model-utils')
    }
}

publishing {
    publications {
        mavenBom(MavenPublication) {
            from components.javaPlatform

            artifactId = 'base-parent'

            pom {
                name = 'A12 Base Parent'
                packaging = 'pom'
                description = 'Parent POM of A12 Base libraries. DEPRECATED since 29.1.1 - use base-bom instead.'
            }
        }
    }
}
