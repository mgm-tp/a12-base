description = 'The default filesystem implementation for the model repository API'

dependencies {
    api project(':model-api')

    implementation project(':model-marshalling')

    testImplementation libs.commons.lang3
    testImplementation libs.testng
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'base-fs-model-repository'
            pom {
                name = 'filesystem-model-repository'
            }
        }
    }
}
